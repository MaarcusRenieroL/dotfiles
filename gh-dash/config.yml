prSections:
  - title: Mine
    filters: is:open author:@me
  - title: Review requested
    filters: is:open review-requested:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
issuesSections:
  - title: Assigned
    filters: is:open assignee:@me
  - title: Created
    filters: is:open author:@me
defaults:
  preview: { open: true, width: 60 }
  prsLimit: 30
  issuesLimit: 30
  view: prs
  layout:
    prs:
      repoName: { grow: true, width: 20, hidden: false }
theme:
  ui:
    table:
      showSeparator: true
  colors:
    text:
      primary: "#e6eaef"
      secondary: "#34d399"
      inverted: "#0b1219"
      faint: "#8c99a8"
      warning: "#fbbf24"
      success: "#34d399"
      error: "#f87171"
    background:
      selected: "#1c2833"
    border:
      primary: "#34d399"
      secondary: "#2a3744"
      faint: "#1c2833"
