add_newline = true
palette = "zoro"
command_timeout = 1200

format = """
$os$username$hostname$directory$git_branch$git_status$git_state$git_metrics$nodejs$java$python$package$docker_context$aws$kubernetes$cmd_duration$jobs$battery
$character
"""

# =========================
# OS / User / Host
# =========================

[os]
disabled = false
style = "bold muted"

[os.symbols]
Macos = " "

[username]
show_always = false
style_user = "bold accent"
style_root = "bold danger"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "bold amber"
format = "on [$hostname]($style) "

# =========================
# Directory
# =========================

[directory]
style = "bold accent"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

# =========================
# Git
# =========================

[git_branch]
symbol = " "
style = "bold violet"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold danger"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "\\$${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[git_state]
style = "bold amber"
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "

[git_metrics]
disabled = false
added_style = "bold accent"
deleted_style = "bold danger"
format = "([+$added]($added_style) [-$deleted]($deleted_style) )"

# =========================
# Languages / Runtimes
# =========================

[nodejs]
symbol = " "
style = "bold accent"
format = "via [$symbol$version]($style) "
detect_files = ["package.json"]

[java]
symbol = " "
style = "bold danger"
format = "via [$symbol$version]($style) "
detect_files = ["pom.xml"]

[package]
symbol = "📦 "
style = "bold amber"
format = "is [$symbol$version]($style) "
disabled = false

# =========================
# Cloud / Infra
# =========================

[docker_context]
symbol = " "
style = "bold accent"
format = "via [$symbol$context]($style) "
only_with_files = true

[aws]
symbol = "☁️ "
style = "bold amber"
format = "on [$symbol$profile( \\($region\\))]($style) "

[kubernetes]
disabled = false
symbol = "☸ "
style = "bold muted"
format = "on [$symbol$context( \\($namespace\\))]($style) "

# =========================
# System Info
# =========================

[cmd_duration]
min_time = 1000
style = "bold amber"
format = "took [$duration]($style) "

[jobs]
symbol = "✦ "
style = "bold accent"
format = "[$symbol$number]($style) "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰁽 "
empty_symbol = "󰂎 "
format = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 25
style = "bold danger"

[[battery.display]]
threshold = 50
style = "bold amber"

# =========================
# Prompt Character
# =========================

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold danger)"
vimcmd_symbol = "[❮](bold violet)"

# =========================
# Palette (maarcus.dev)
# =========================

[palettes.zoro]
accent = "#34d399"
muted = "#8c99a8"
violet = "#a78bfa"
amber = "#fbbf24"
danger = "#f87171"
